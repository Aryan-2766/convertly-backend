# ===================================================================
# Convertly Backend Configuration (Sanitized for Version Control)
# ===================================================================
spring.application.name=convertly-backend
server.port=8080

# -------------------------------------------------------------------
# Aiven Cloud MySQL Configuration (Env Vars with fallback defaults)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Resilient Connection Pooling: do not crash application at boot if DB is unreachable
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# -------------------------------------------------------------------
# File Upload Limits (Multipart)
# -------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# -------------------------------------------------------------------
# Transient Processing & Ephemeral Storage
# Files are processed in-memory / temporary scratch and wiped after use.
# No persistent files are stored on local disk.
# -------------------------------------------------------------------
convertly.storage.ephemeral=true
convertly.storage.scratch-dir=${java.io.tmpdir}/convertly_scratch
convertly.storage.retention-minutes=15

# CORS Allowed Origins
convertly.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Optional: activate local profile if application-local.properties exists
spring.profiles.group.local=local
